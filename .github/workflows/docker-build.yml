name: Build Custom Frappe Image

on:
  push:
    branches: [main]
    paths:
      - "images/custom/Containerfile"
      - "apps.json"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra tag for the image (in addition to latest + git sha)"
        required: false
        default: "manual"

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test GH_PAT access to company Frappe repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT is empty"
            exit 1
          fi

          echo "✓ GH_PAT is configured"
          echo "Testing access to bizaxl/frappe..."

          git -c http.extraheader="Authorization: Bearer $GH_PAT" \
            ls-remote https://github.com/bizaxl/frappe.git \
            HEAD refs/heads/main

          echo "✓ GH_PAT can access bizaxl/frappe"

      - name: Write GitHub token to a temp file
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          printf '%s' "$GH_PAT" > "$RUNNER_TEMP/github_token"
          chmod 600 "$RUNNER_TEMP/github_token"

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=apps.json
            github_token=${{ runner.temp }}/github_token
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:${{ github.event.inputs.image_tag || 'auto' }}

      - name: Report build time
        if: always()
        run: |
          END=$(date +%s)
          DURATION=$((END - BUILD_START))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          {
            echo "### Docker Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Containerfile | \`images/custom/Containerfile\` |"
            echo "| Platform | linux/amd64 |"
            echo "| Build duration | **${MINUTES}m ${SECONDS}s** (${DURATION}s total) |"
            echo "| Git commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:${{ github.sha }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"